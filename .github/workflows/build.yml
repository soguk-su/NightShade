
name: Build NightShade APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract NightShade
        run: |
          mkdir -p source
          unzip -o NightShade_Telefonla_APK_Projesi.zip -d source
          test -f source/settings.gradle.kts

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NightShade-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
