
name: Build NightShade APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          unzip -q NightShade_Telefonla_APK_Projesi.zip -d source

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NightShade-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
